<h2>Всі оцінки учнів</h2>
<table>
    <tr>
        <th>Учень</th>
        <th>Предмет</th>
        <th>Оцінка</th>
        <th>Дата</th>
    </tr>
    {% for g in grades %}
    <tr>
        <td>{{ g.student.username }}</td>
        <td>{{ g.subject.name }}</td>
        <td>{{ g.grade }}</td>
        <td>{{ g.date }}</td>
    </tr>
    {% endfor %}
</table>
